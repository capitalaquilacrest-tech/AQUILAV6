{c:"Closing",k:"Thank You",t:"Rise with Strength. Grow with Confidence.",s:"Questions and discussion",i:"🦅",x:"cover"}
];
const welcomeRate=a=>a<1000?0:a<=10000?.05:a<=20000?.06:a<=50000?.07:a<=100000?.08:a<=200000?.09:a<=500000?.10:.15;
const minDays=a=>a<5000?7:a<10000?15:a<25000?30:a<50000?45:a<100000?60:a<250000?90:120;
const reserveRate=d=>{let g=d<=60?12+(d-7)*(78/53):d<=120?90+(d-60)*1.5:d<=180?180+(d-120)*1.8:288+(d-180)*(387/185);return{growth:Math.round(g*100)/100,multiplier:Math.round((1+g/100)*1000)/1000}};
let current=0,autoplay=null,touchX=null;
const slide=document.getElementById("slide"),bar=document.getElementById("bar"),menu=document.getElementById("menu");
function passiveHTML(){return `<div class="calc"><div class="inputs"><label>Investment amount<input id="pAmount" type="number" min="1000" value="1000"></label><label>Deposit sequence<select id="pSeq"><option value="1">First deposit</option><option value="2">2nd–15th deposit</option><option value="16">16th onward</option></select></label></div><div class="metrics"><div class="metric"><small>Applicable bonus</small><b id="pBonus"></b></div><div class="metric"><small>Bonus-credited investment</small><b id="pCredited"></b></div><div class="metric"><small>Daily return at 3%</small><b id="pDaily"></b></div><div class="metric hero"><small>60-day projected total</small><b id="pTotal"></b></div></div><p class="fine">The applicable bonus is credited first. The 3% daily return is computed from that credited investment. The 60-day total already includes capital and profit.</p></div>`}
function reserveHTML(){return `<div class="calc"><div class="inputs"><label>Reserve amount<input id="rAmount" type="number" min="300" value="5000"></label><label>Eligible maturity<select id="rDays"></select></label></div><div class="metrics"><div class="metric"><small>Growth rate</small><b id="rGrowth"></b></div><div class="metric"><small>Multiplier</small><b id="rMulti"></b></div><div class="metric"><small>Projected net growth</small><b id="rProfit"></b></div><div class="metric hero"><small>Maturity value</small><b id="rTotal"></b></div></div><p class="fine" id="rNote"></p></div>`}
function samplesHTML(){return `<div class="samples">${[1000,10000,50000,100000].map(a=>{let b=a*welcomeRate(a),c=a+b,d=c*.03,t=d*60;return `<article class="sample"><h3>${peso(a)}</h3><small>Bonus ${welcomeRate(a)*100}%: ${peso(b)}</small><b>Daily: ${peso(d)}</b><strong>60 days: ${peso(t)}</strong><em>Net profit: ${peso(t-a)}</em></article>`}).join("")}</div>`}
function mythsHTML(){return `<div class="myths">${[["Passive Yield and Capital Reserve are the same.","They are separate options with different cycles and access rules."],["Capital Reserve growth is withdrawable daily.","Capital and growth are received at eligible maturity."],["Welcome Bonus applies to every deposit.","It applies to the first deposit only."],["Reload Bonus continues forever.","It applies only to qualified 2nd–15th deposits."],["Sample totals include every earning method.","Direct and Network Yield are separate unless explicitly included."]].map(x=>`<article class="myth"><del>${x[0]}</del><b>${x[1]}</b></article>`).join("")}</div>`}
function render(){const s=slides[current];let h=s.h||"";if(s.type==="passive")h=passiveHTML();if(s.type==="reserve")h=reserveHTML();if(s.type==="samples")h=samplesHTML();if(s.type==="myths")h=mythsHTML();if(s.type==="live")h=`<p class="live"><i></i><span id="liveStatus">Connecting…</span></p><div class="activity" id="activity"><p>Loading live public-safe activity…</p></div>`;slide.className=`slide ${s.x||""}`;slide.innerHTML=`<div class="inner"><div class="number">${String(current+1).padStart(2,"0")}</div>${s.i?`<div class="heroIcon">${s.i}</div>`:""}<p class="kicker">${s.k}</p><h1>${s.t}</h1>${s.s?`<p class="subtitle">${s.s}</p>`:""}${h?`<div class="content">${h}</div>`:""}<div class="foot"><span>${s.c}</span><i></i><span>${current+1} / ${slides.length}</span></div></div>`;bar.style.width=((current+1)/slides.length*100)+"%";document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===slides.length-1;if(s.type==="passive")initPassive();if(s.type==="reserve")initReserve();if(s.type==="live")loadLive()}
function initPassive(){const a=document.getElementById("pAmount"),q=document.getElementById("pSeq");const update=()=>{let n=Math.max(0,+a.value),seq=+q.value,rate=seq===1?welcomeRate(n):seq===2?.05:0,bonus=n*rate,credited=n+bonus,daily=credited*.03,total=daily*60;document.getElementById("pBonus").textContent=`${peso(bonus)} (${rate*100}%)`;document.getElementById("pCredited").textContent=peso(credited);document.getElementById("pDaily").textContent=peso(daily);document.getElementById("pTotal").textContent=peso(total)};a.oninput=q.onchange=update;update()}
function initReserve(){const a=document.getElementById("rAmount"),d=document.getElementById("rDays");const build=()=>{let m=minDays(+a.value),old=Math.max(m,+d.value||m);d.innerHTML=Array.from({length:366-m},(_,i)=>m+i).map(x=>`<option ${x===old?"selected":""}>${x}</option>`).join("")};const update=()=>{let amount=Math.max(300,+a.value),days=+d.value||minDays(amount),r=reserveRate(days),total=amount*r.multiplier,date=new Date();date.setDate(date.getDate()+days);document.getElementById("rGrowth").textContent=r.growth+"%";document.getElementById("rMulti").textContent=r.multiplier+"×";document.getElementById("rProfit").textContent=peso(total-amount);document.getElementById("rTotal").textContent=peso(total);document.getElementById("rNote").textContent=`Minimum: ${minDays(amount)} days · Projected maturity: ${date.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})}`};a.oninput=()=>{build();update()};d.onchange=update;build();update()}
async function loadLive(){try{const r=await fetch(API+"?action=activity&_="+Date.now()),j=await r.json(),items=(j.activities||[]).slice(0,4);document.getElementById("liveStatus").textContent="Live data";document.getElementById("activity").innerHTML=items.length?items.map(x=>`<article><small>${x.type||"Activity"}</small><b>${x.title||"Update"}</b><strong>${peso(x.amount)}</strong><span>${x.displayName||"Aquila Member"} · ${x.status||""}</span></article>`).join(""):"<p>No public activity is available yet.</p>"}catch{document.getElementById("liveStatus").textContent="Temporarily unavailable"}}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}document.getElementById("prev").onclick=()=>go(current-1);document.getElementById("next").onclick=()=>go(current+1);document.getElementById("home").onclick=()=>go(0);document.getElementById("chapters").onclick=()=>menu.classList.toggle("show");document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById("all").onclick=()=>{document.body.classList.toggle("allMode");if(document.body.classList.contains("allMode")){document.getElementById("deck").innerHTML=slides.map((s,i)=>`<section class="slide ${s.x||""}"><div class="inner"><p class="kicker">${s.k}</p><h1>${s.t}</h1>${s.s?`<p class="subtitle">${s.s}</p>`:""}${s.h?`<div class="content">${s.h}</div>`:""}<div class="foot"><span>${s.c}</span><i></i><span>${i+1} / ${slides.length}</span></div></div></section>`).join("")}else location.reload()};document.getElementById("auto").onclick=e=>{if(autoplay){clearInterval(autoplay);autoplay=null;e.currentTarget.innerHTML="<span>▶</span> Auto"}else{autoplay=setInterval(()=>go(current+1>=slides.length?0:current+1),9000);e.currentTarget.innerHTML="<span>■</span> Stop"}};
[...new Set(slides.map(s=>s.c))].forEach(ch=>{const b=document.createElement("button");b.textContent=ch;b.onclick=()=>{go(slides.findIndex(s=>s.c===ch));menu.classList.remove("show")};menu.appendChild(b)});window.addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(current+1)}if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="f")document.documentElement.requestFullscreen?.()});document.getElementById("deck").addEventListener("touchstart",e=>touchX=e.touches[0].clientX);document.getElementById("deck").addEventListener("touchend",e=>{let d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>60)go(current+(d<0?1:-1))});render();
</script>
</body></html>
